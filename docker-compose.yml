services:
  mongo:
    image: mongo:7-jammy
    container_name: milli_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: milli_backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-milli}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,capacitor://localhost,http://localhost,https://localhost}

      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-not-configured}
      PLAID_SECRET: ${PLAID_SECRET:-not-configured}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}

      STRIPE_API_KEY: ${STRIPE_API_KEY:-not-configured}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CARD_WEBHOOK_SECRET: ${STRIPE_CARD_WEBHOOK_SECRET:-}

      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-not-configured}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-app.milli.tax}
      APNS_ENV: ${APNS_ENV:-sandbox}

      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_IAP_ENVIRONMENT: ${APPLE_IAP_ENVIRONMENT:-Sandbox}

      TAXBANDITS_CLIENT_ID: ${TAXBANDITS_CLIENT_ID:-}
      TAXBANDITS_CLIENT_SECRET: ${TAXBANDITS_CLIENT_SECRET:-}
      TAXBANDITS_USER_TOKEN: ${TAXBANDITS_USER_TOKEN:-}
      TAXBANDITS_AUTH_URL: ${TAXBANDITS_AUTH_URL:-https://testoauth.expressauth.net/v2/tbsauth}
      TAXBANDITS_API_BASE: ${TAXBANDITS_API_BASE:-https://testapi.taxbandits.com/v1.7.3}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./marketing_site:/app/marketing_site:ro
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: milli_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm start

volumes:
  mongo_data:
  frontend_node_modules:
