services:
  - type: web
    name: milli-tax-vault-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: sandbox

      # Plaid - account connectivity/data
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_WEBHOOK_URL
        sync: false

      # Column - banking / ACH money movement
      - key: COLUMN_ENV
        value: sandbox
      - key: COLUMN_BASE_URL
        value: https://api.column.com
      - key: COLUMN_API_KEY
        sync: false

      # Core backend / identity
      - key: DATABASE_URL
        sync: false
      - key: APPLE_SIGN_IN_AUDIENCE
        value: com.milli.taxvault
