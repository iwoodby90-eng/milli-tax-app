services:
  - type: web
    name: milli-tax-vault-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: sandbox
      - key: PLAID_ENV
        value: sandbox
      # Secrets and deployment-specific URLs are set in Render, never committed.
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_WEBHOOK_URL
        sync: false
      # Required by Plaid for native iOS OAuth institutions. This must exactly
      # match an Allowed redirect URI in the Plaid Dashboard and a Universal
      # Link handled by the iOS app / apple-app-site-association file.
      - key: PLAID_REDIRECT_URI
        sync: false
      - key: CLIENT_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
