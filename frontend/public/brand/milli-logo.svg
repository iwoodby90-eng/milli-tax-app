<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Milli">
    <defs>
        <linearGradient id="mChrome" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#F0F0F0"/>
            <stop offset="35%" stop-color="#E8E8E8"/>
            <stop offset="55%" stop-color="#808080"/>
            <stop offset="80%" stop-color="#C0C0C0"/>
            <stop offset="100%" stop-color="#F0F0F0"/>
        </linearGradient>
        <linearGradient id="mRoad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%"  stop-color="#00E5FF" stop-opacity="0.15"/>
            <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#00E5FF" stop-opacity="1"/>
        </linearGradient>
        <radialGradient id="mGlow" cx="50%" cy="88%" r="55%">
            <stop offset="0%"  stop-color="#00E5FF" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
        </radialGradient>
        <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Cyan floor glow beneath the mark -->
    <ellipse cx="64" cy="118" rx="52" ry="12" fill="url(#mGlow)"/>

    <!-- Chrome M — sharp angular strokes, mirror-polished gradient -->
    <path
        d="M 12 116 L 12 20 L 32 12 L 54 60 L 64 40 L 74 60 L 96 12 L 116 20 L 116 116 L 96 116 L 96 48 L 76 84 L 64 68 L 52 84 L 32 48 L 32 116 Z"
        fill="url(#mChrome)"
        stroke="#0A0D10"
        stroke-width="1"
        stroke-linejoin="round"
        filter="url(#mShadow)"/>

    <!-- Turquoise perspective runway rising through the M valley -->
    <path
        d="M 52 118 L 60 82 L 63 56 L 65 56 L 68 82 L 76 118 Z"
        fill="url(#mRoad)"/>

    <!-- Dashed center-line of the runway -->
    <rect x="63.4" y="102" width="1.2" height="8" fill="#FFFFFF" opacity="0.95"/>
    <rect x="63.4" y="90"  width="1.2" height="6" fill="#FFFFFF" opacity="0.75"/>
    <rect x="63.4" y="80"  width="1.2" height="4" fill="#FFFFFF" opacity="0.5"/>
    <rect x="63.4" y="72"  width="1.2" height="3" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="64" cy="58" r="1.4" fill="#00E5FF"/>
</svg>
