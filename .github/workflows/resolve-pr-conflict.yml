name: Resolve PR conflict

on:
  push:
    branches:
      - agent/fix-capacitor7-build-regressions
    paths:
      - .github/workflows/resolve-pr-conflict.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-capacitor7-build-regressions
          fetch-depth: 0
      - name: Merge current main and preserve hardened startup HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-ff origin/main -m "Merge current main into release branch"; then
            git checkout --ours frontend/public/index.html
            git add frontend/public/index.html
            git commit -m "Merge current main into release branch"
          fi
          git push origin HEAD:agent/fix-capacitor7-build-regressions
