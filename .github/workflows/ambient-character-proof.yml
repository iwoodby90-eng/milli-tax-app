name: Ambient Character Visual Proof

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit proof artifacts into the repo (visual-proof/)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ambient-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Capture ambient character proof (${{ matrix.device }})
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: "iPhone 16e"          # compact
            udid: auto
          - device: "iPhone 16"           # standard
            udid: auto
          - device: "iPhone 16 Pro Max"   # Pro Max
            udid: auto

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve simulator UDID for ${{ matrix.device }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          payload = json.load(sys.stdin)
          target = '${{ matrix.device }}'
          for devices in payload.get('devices', {}).values():
              for d in devices:
                  if d.get('isAvailable') and d.get('name') == target:
                      print(d['udid']); break
          ")
          if [ -z "$UDID" ]; then
            echo "Simulator ${{ matrix.device }} not found; listing available devices:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Resolved ${{ matrix.device }} -> $UDID"

      - name: Capture proof artifacts
        env:
          SIMULATOR_UDID: ${{ env.SIMULATOR_UDID }}
          OUT_DIR: proof-out
        run: |
          bash scripts/capture-ambient-character-proof.sh

      - name: Record commit SHA and device names
        run: |
          mkdir -p proof-out
          {
            echo "Commit SHA tested: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF"
            echo "Simulator: ${{ matrix.device }} (UDID $SIMULATOR_UDID)"
            echo "Captured: $(date -u)"
          } > proof-out/PROOF-METADATA.txt
          cat proof-out/PROOF-METADATA.txt

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ambient-proof-${{ matrix.device }}
          path: proof-out
          retention-days: 14

      - name: Publish proof into repo (visual-proof/)
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DEST="visual-proof/ambient-character/$(echo '${{ matrix.device }}' | tr ' ' '-')"
          mkdir -p "$DEST"
          cp -R proof-out/* "$DEST/"
          git add visual-proof
          git commit -m "visual-proof: ambient character ${{ matrix.device }} @ $GITHUB_SHA" || echo "nothing to commit"
          git push