name: Canonical Nav Visual Capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'MilliTaxVault/Components/MilliNavBar.swift'
      - '.github/workflows/nav-visual-capture.yml'

permissions:
  contents: read

concurrency:
  group: nav-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Nav capture (${{ matrix.device_class }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_class: compact
            device: 'iPhone SE (3rd generation)'
          - device_class: standard
            device: 'iPhone 15'
          - device_class: promax
            device: 'iPhone 15 Pro Max'

    steps:
      - uses: actions/checkout@v4

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project MilliTaxVault.xcodeproj \
            -scheme MilliTaxVault \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=latest" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and install
        run: |
          set -o pipefail
          xcrun simctl boot "${{ matrix.device }}" || true
          xcrun simctl bootstatus "${{ matrix.device }}" -b
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name 'MilliTaxVault.app' | head -n 1)
          test -n "$APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl launch booted "$BUNDLE_ID"
          sleep 6

      - name: Capture runtime
        run: |
          mkdir -p screenshots
          xcrun simctl io booted screenshot "screenshots/${{ matrix.device_class }}-runtime.png"

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-nav-${{ matrix.device_class }}
          path: screenshots/
          retention-days: 30
