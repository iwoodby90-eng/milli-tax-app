name: Validate Milli

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - name: Check ESLint errors
        run: npx eslint src --quiet
      - name: Build production web bundle
        env:
          CI: "false"
        run: npm run build
      - run: npm test -- --runInBand

  backend:
    name: Backend install and engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Import production API
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: milli_ci
          JWT_SECRET: ci-only-secret-that-is-longer-than-32-bytes
          APP_ENV: test
          CORS_ORIGINS: http://localhost:3000
          PLAID_CLIENT_ID: not-configured
          PLAID_SECRET: not-configured
          PLAID_ENV: sandbox
          EMERGENT_LLM_KEY: not-configured
          STRIPE_API_KEY: not-configured
          DEMO_MODE_ENABLED: "false"
          ALLOW_UNVERIFIED_STOREKIT: "false"
        run: python -c "import server; assert server.app.title == 'Milli API'"
      - name: Run tax engine tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_phase2_engine.py tests/test_2025_tax_constants.py

  ios:
    name: Capacitor iOS sync and CocoaPods
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - name: Build production web bundle
        env:
          CI: "false"
        run: npm run build
      - run: npx cap sync ios
      - run: pod install
        working-directory: frontend/ios/App
      - name: Compile iOS simulator target
        run: >-
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: frontend/ios/App
