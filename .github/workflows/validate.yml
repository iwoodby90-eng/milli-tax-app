name: Validate Milli

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-swiftui:
    name: Native SwiftUI Xcode build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List native project
        run: xcodebuild -project MilliTaxVault.xcodeproj -list

      - name: Compile Milli native iOS simulator target
        run: >-
          xcodebuild
          -project MilliTaxVault.xcodeproj
          -scheme MilliTaxVault
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
