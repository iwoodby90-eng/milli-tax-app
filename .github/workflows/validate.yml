name: Validate Milli

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Native SwiftUI Xcode build
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List native project
        run: xcodebuild -project MilliTaxVault.xcodeproj -list

      - name: Compile native iOS simulator target
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project MilliTaxVault.xcodeproj \
            -scheme MilliTaxVault \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/milli-native-build.log"

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milli-native-build-diagnostics
          path: ${{ runner.temp }}/milli-native-build.log
          if-no-files-found: warn

  unit-tests:
    name: Unit tests (MilliTaxVault scheme)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests (shared MilliTaxVault scheme)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project MilliTaxVault.xcodeproj \
            -scheme MilliTaxVault \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/milli-unit-tests.log" | xcbeautify
        env:
          NSUnbufferedIO: YES

      - name: Upload unit test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milli-unit-test-diagnostics
          path: ${{ runner.temp }}/milli-unit-tests.log
          if-no-files-found: warn

      - name: Test summary
        if: always()
        run: echo "Unit tests executed via xcodebuild test on the shared MilliTaxVault scheme."
