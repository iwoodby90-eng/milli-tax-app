name: Validate Milli

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Native SwiftUI Xcode build
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List native project
        run: xcodebuild -project MilliTaxVault.xcodeproj -list

      - name: Compile native iOS simulator target
        run: |
          xcodebuild \
            -project MilliTaxVault.xcodeproj \
            -scheme MilliTaxVault \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-tests:
    name: Unit tests (MilliTaxVault scheme)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests (shared MilliTaxVault scheme)
        run: |
          set -o pipefail
          xcodebuild test \
            -project MilliTaxVault.xcodeproj \
            -scheme MilliTaxVault \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
        env:
          NSUnbufferedIO: YES

      - name: Test summary
        if: always()
        run: echo "Unit tests executed via xcodebuild test on the shared MilliTaxVault scheme."
