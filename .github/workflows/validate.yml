name: Validate Milli

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Native SwiftUI Xcode build
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List native project
        run: xcodebuild -project MilliTaxVault.xcodeproj -list

      - name: Compile native iOS simulator target
        run: >-
          xcodebuild
          -project MilliTaxVault.xcodeproj
          -scheme MilliTaxVault
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  home-visual-qa:
    name: Home simulator screenshot
    needs: native-build
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$({ xcrun simctl list devices available -j; } | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append(device)
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          preferred = next((d for d in candidates if "Pro" in d["name"] and "Max" not in d["name"]), candidates[0])
          print(preferred["udid"])
          ')"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Using simulator: $SIMULATOR_UDID"

      - name: Build app for selected simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project MilliTaxVault.xcodeproj \
            -scheme MilliTaxVault \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/MilliDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator with bounded wait
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          udid = os.environ["SIMULATOR_UDID"]
          try:
              result = subprocess.run(
                  ["xcrun", "simctl", "boot", udid],
                  timeout=20,
                  check=False,
                  text=True,
                  capture_output=True,
              )
              print(result.stdout)
              print(result.stderr)
          except subprocess.TimeoutExpired:
              print("simctl boot request exceeded 20 seconds; continuing with bounded readiness checks")
          PY

          READY=0
          for attempt in {1..45}; do
            STATE="$(xcrun simctl list devices | grep "$SIMULATOR_UDID" || true)"
            echo "$STATE"
            if echo "$STATE" | grep -q "Booted"; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Hosted simulator did not reach Booted state within the readiness window."
            exit 1
          fi

      - name: Launch Home and capture screenshot
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MilliDerivedData/Build/Products/Debug-iphonesimulator/MilliTaxVault.app"
          SCREENSHOT_PATH="$RUNNER_TEMP/milli-home.png"
          test -d "$APP_PATH"

          python3 - <<'PY'
          import os, subprocess, time

          udid = os.environ["SIMULATOR_UDID"]
          app_path = os.path.join(os.environ["RUNNER_TEMP"], "MilliDerivedData", "Build", "Products", "Debug-iphonesimulator", "MilliTaxVault.app")
          screenshot_path = os.path.join(os.environ["RUNNER_TEMP"], "milli-home.png")

          def run_bounded(args, timeout=30, required=True):
              print("$", " ".join(args))
              try:
                  result = subprocess.run(args, timeout=timeout, text=True, capture_output=True)
              except subprocess.TimeoutExpired as exc:
                  print(f"Command timed out after {timeout}s: {args}")
                  if required:
                      raise SystemExit(1) from exc
                  return None
              print(result.stdout)
              print(result.stderr)
              if required and result.returncode != 0:
                  raise SystemExit(result.returncode)
              return result

          run_bounded(["xcrun", "simctl", "install", udid, app_path], timeout=60)
          run_bounded([
              "xcrun", "simctl", "launch", udid, "com.milli.taxvault",
              "-milliScreenshotMode", "-milliScreen", "home"
          ], timeout=35)
          time.sleep(6)
          run_bounded(["xcrun", "simctl", "io", udid, "screenshot", screenshot_path], timeout=35)
          PY

          test -s "$SCREENSHOT_PATH"

      - name: Upload Home visual QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: milli-home-visual-qa
          path: ${{ runner.temp }}/milli-home.png
          if-no-files-found: error
          retention-days: 14
