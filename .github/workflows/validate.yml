name: Validate Milli

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --runInBand

  backend:
    name: Backend install and engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest -q tests/test_phase2_engine.py tests/test_2025_tax_constants.py

  ios:
    name: Capacitor iOS sync and CocoaPods
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync ios
      - run: pod install
        working-directory: frontend/ios/App
      - name: Compile iOS simulator target
        run: >-
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: frontend/ios/App
