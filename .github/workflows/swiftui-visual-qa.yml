name: SwiftUI Visual QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'MilliTaxVault/**'
      - 'MilliTaxVault.xcodeproj/**'
      - 'scripts/capture-milli-screens.sh'
      - 'scripts/verify-milli-screen-captures.sh'
      - '.github/workflows/swiftui-visual-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'MilliTaxVault/**'
      - 'MilliTaxVault.xcodeproj/**'
      - 'scripts/capture-milli-screens.sh'
      - 'scripts/verify-milli-screen-captures.sh'
      - '.github/workflows/swiftui-visual-qa.yml'

permissions:
  contents: read

concurrency:
  group: swiftui-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Native visual evidence (${{ matrix.device_class }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_class: compact
            device: iPhone 16e
          - device_class: standard
            device: iPhone 17
          - device_class: promax
            device: iPhone 17 Pro Max

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Capture screen-by-screen references
        shell: bash
        env:
          SIMULATOR_NAME: ${{ matrix.device }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/milli-screen-qa" bash scripts/capture-milli-screens.sh

      - name: Verify capture routing and image sanity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-milli-screen-captures.sh "$RUNNER_TEMP/milli-screen-qa"

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milli-swiftui-screen-qa-${{ matrix.device_class }}
          path: ${{ runner.temp }}/milli-screen-qa/*.png
          if-no-files-found: error
          retention-days: 14
