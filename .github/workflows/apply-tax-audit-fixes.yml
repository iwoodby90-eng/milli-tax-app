name: Apply tax audit fixes

on:
  push:
    branches:
      - agent/fix-capacitor7-build-regressions
    paths:
      - scripts/apply_tax_audit_fixes.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-capacitor7-build-regressions
          fetch-depth: 0
      - run: python scripts/apply_tax_audit_fixes.py
      - name: Verify and commit tax corrections
        run: |
          python -m py_compile backend/tax_engine.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tax_engine.py backend/tests/test_2025_tax_constants.py backend/pytest.ini
          git commit -m "Correct 2025 tax rules and async tests"
          git push origin HEAD:agent/fix-capacitor7-build-regressions
